<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>PFF Debug</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:monospace;padding:24px}
pre{background:#111;border:1px solid #222;border-radius:8px;padding:16px;overflow:auto;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
h2{color:#3b82f6;margin:16px 0 8px}
button{background:#3b82f6;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;margin-bottom:20px}
</style>
</head>
<body>
<h1 style="color:#fff;margin-bottom:16px">PFF Debug — структура данных</h1>
<button onclick="load()">Загрузить данные</button>
<h2>Первые 5 строк листа 2026 (PFF) — все ключи и значения:</h2>
<pre id="out">Нажми кнопку...</pre>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyGRwLrCvO4MxYZOssBDIwMONBTZA1yOrJ1OekFTX3rVnjqbvLb0XI8d1ngDybRHrZs/exec';

async function load() {
  document.getElementById('out').textContent = 'Загружаю...';
  try {
    const r = await fetch(API + '?t=' + Date.now());
    const data = await r.json();

    const pffKey = Object.keys(data).find(k => k === '2026 (PFF)');
    const rows = data[pffKey] || [];

    let out = `Лист найден: "${pffKey}"\nВсего строк: ${rows.length}\n\n`;

    // Показываем первые 8 строк с данными (не пустых)
    let shown = 0;
    for (let i = 0; i < rows.length && shown < 8; i++) {
      const row = rows[i];
      const keys = Object.keys(row);
      const vals = Object.values(row);

      // Берём только непустые строки
      const hasData = vals.some(v => v !== '' && v !== null && v !== undefined && v !== 0);
      if (!hasData) continue;

      out += `=== Строка ${i} ===\n`;
      keys.forEach((k, idx) => {
        const v = row[k];
        if (v !== '' && v !== null && v !== undefined) {
          out += `  ключ[${idx}] "${k}" = ${JSON.stringify(v)}\n`;
        }
      });
      out += '\n';
      shown++;
    }

    document.getElementById('out').textContent = out;
  } catch(e) {
    document.getElementById('out').textContent = 'Ошибка: ' + e.message;
  }
}
</script>
</body>
</html>
