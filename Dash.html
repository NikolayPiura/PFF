*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--bg2:#111;--bg3:#181818;--bg4:#222;
  --border:#252525;--text:#fff;--text2:#aaa;--text3:#555;
  --blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:32px 40px 28px;display:flex;align-items:flex-end;justify-content:space-between}

.logo .fam{color:var(--blue)}
.header-meta{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.upd{font-size:13px;color:var(--text3)}
.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px 26px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.btn:hover{background:#2563eb}
.btn.loading{opacity:.5;pointer-events:none}

/* CONTAINER */
.wrap{padding:32px 40px;display:flex;flex-direction:column;gap:32px;max-width:1440px;margin:0 auto}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:28px 30px}
.ml{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}

.ms{font-size:14px;color:var(--text2);margin-top:8px}
.badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.05em}
.bg{background:rgba(34,197,94,.15);color:var(--green)}
.bb{background:rgba(59,130,246,.15);color:var(--blue)}

/* SECTION */

.legend{display:flex;flex-direction:column;gap:8px;width:100%}

/* GOALS */

.rs-val{font-size:24px;font-weight:800}
.rs-sub{font-size:12px;color:var(--text3);margin-top:3px}
.bar-bg{height:7px;background:var(--bg4);border-radius:4px;margin-top:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .7s ease}

/* LOADING */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:18px}
.spin{width:48px;height:48px;border:3px solid #222;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ltxt{font-size:16px;color:var(--text2)}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:18px;color:var(--red);font-size:14px}
</style>

<script>
// ═══════════════════════════════════════════════════════
// КОНФИГУРАЦИЯ — вставь свой URL здесь
// ═══════════════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbyGRwLrCvO4MxYZOssBDIwMONBTZA1yOrJ1OekFTX3rVnjqbvLb0XI8d1ngDybRHrZs/exec';
const SHEET_NAME = '2026 (PFF)'; // Название листа с основными данными

// Цвета
const COLORS = ['#2563eb','#16a34a','#dc2626','#d97706','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#0284c7','#9333ea','#ca8a04'];

let allData = {};
let chartInstances = [];
let sortCol = 3; // по умолчанию сортировка по сумме
let sortDir = -1;
let filterText = '';

// ═══════════════════════════════════════════════════════
// ПАРСИНГ
// ═══════════════════════════════════════════════════════
function parseMoney(v) {
  if (v === null || v === undefined || v === '') return 0;
  const s = String(v).replace(/[$\s,\u00a0 ]/g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parsePercent(v) {
  if (v === null || v === undefined || v === '' || v === '-') return 0;
  const s = String(v).replace('%', '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
const API = 'https://script.google.com/macros/s/AKfycbyGRwLrCvO4MxYZOssBDIwMONBTZA1yOrJ1OekFTX3rVnjqbvLb0XI8d1ngDybRHrZs/exec';

const TYPES = [
  {id:'bank',   name:'Счета, вклады и нал',  color:'#3b82f6', kw:['ally','truist','5/3','chase','bank','налич','счёт','вклад','нал','депозит']},
  {id:'realty', name:'Инвест. недвижимость', color:'#f59e0b', kw:['недвиж','realty','квартир','дом','аренд']},
  {id:'gold',   name:'Золото',               color:'#eab308', kw:['золот','gold','слиток']},
  {id:'market', name:'Фондовый рынок',       color:'#22c55e', kw:['фондов','рынок','apple','акци','solid','фонд','market','etf','бирж']},
  {id:'loans',  name:'Займы / бизнес',       color:'#a855f7', kw:['займ','заём','loan','компани','rate','paff','ганзюк','лукьян','даламан','чеботок','ольхов','пашков','процент']},
  {id:'crypto', name:'Крипта / проекты',     color:'#06b6d4', kw:['крипт','bybit','тг','binance','битко','юсдт','usdt','btc','eth','tok']},
];

let charts = [];
let _td = null, _total = 0, _assets = [];

function pm(v){
  if(v===null||v===undefined||v===''||v==='-') return 0;
  const n=parseFloat(String(v).replace(/[$\s,\u00a0\u202f]/g,'').replace(',','.'));
  return isNaN(n)?0:n;
}

function fmt(n, currency) {
  if (!n || n === 0) return currency ? '$0' : '0';
  const prefix = currency ? '$' : '';
  if (Math.abs(n) >= 1000000) return prefix + (n / 1000000).toFixed(2) + 'M';
  if (Math.abs(n) >= 1000) return prefix + Math.round(n).toLocaleString('ru');
  return prefix + Math.round(n).toLocaleString('ru');
function fmt(n){
  if(!n&&n!==0) return '$0';
  n=Math.round(n);
  if(Math.abs(n)>=1000000) return '$'+(n/1000000).toFixed(2)+'M';
  if(Math.abs(n)>=1000) return '$'+n.toLocaleString('ru');
  return '$'+n;
}
function fp(n){return n?n.toFixed(1)+'%':'0%'}

function fmtPct(n) {
  if (!n || n === 0) return '-';
  return n.toFixed(1) + '%';
function classify(name){
  const n=name.toLowerCase();

    if(t.kw.some(k=>n.includes(k))) return t.id;

// ═══════════════════════════════════════════════════════
// ПОЛУЧЕНИЕ ДАННЫХ
// ═══════════════════════════════════════════════════════
async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  btn.textContent = '↻ Загрузка...';
  document.getElementById('loadingOverlay').style.display = 'flex';

    if (!res.ok) throw new Error('HTTP ' + res.status);

  } catch(e) {

    document.getElementById('errorMsg').innerHTML = 'Не удалось подключиться: <code>' + e.message + '</code>';
  } finally {
    document.getElementById('loadingOverlay').style.display = 'none';
    btn.classList.remove('loading');
    btn.textContent = '↻ Обновить';
function loadGoals(){try{return JSON.parse(localStorage.getItem('pff_g')||'{}')}catch(e){return {}}}
function saveGoal(id,v){const g=loadGoals();g[id]=v;localStorage.setItem('pff_g',JSON.stringify(g))}

async function loadData(){
  document.getElementById('rbtn').classList.add('loading');
  document.getElementById('ov').style.display='flex';
  document.getElementById('err').style.display='none';
  try{
    const r=await fetch(API+'?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    process(data);
    document.getElementById('upd').textContent='Обновлено: '+new Date().toLocaleString('ru');
  }catch(e){
    const eb=document.getElementById('err');
    eb.style.display='block';

    document.getElementById('ov').style.display='none';

}
}

// ═══════════════════════════════════════════════════════
// ПАРСИНГ ЛИСТА 2026 (PFF)
// ═══════════════════════════════════════════════════════
function parseSheet(data) {
  if (!data || !Array.isArray(data) || data.length === 0) return [];

  // Ищем ключи в первой строке
  const first = data[0];
  const keys = Object.keys(first);

  // Ключи: "    " = АКТИВ, "" = ЗАКРЫТИЕ, числовые = СУММА, % МЕСЯЦ и тд
  // Из скриншота: АКТИВ, ЗАКРЫТИЕ, ДОК, СУММА, %, МЕСЯЦ, НЕДЕЛЯ, ВЫПЛАТА...
  // В JSON ключ для АКТИВ = "    " (пробелы), для дат/значений = ""
function process(data){
  // Найти лист PFF
  const pKey=Object.keys(data).find(k=>k.includes('PFF')&&!k.includes('2')&&!k.includes('3'));
  const rows=pKey?data[pKey]:[];

  const assets=[];
  rows.forEach(row=>{
    // Имя актива может быть в разных ключах
    const name=String(
      row['    ']||row['АКТИВ']||row['Актив']||row['актив']||
      Object.values(row)[0]||''
    ).trim();
    if(!name||name.toUpperCase()==='ИТОГО'||name.toUpperCase()==='АКТИВ'||name==='') return;

    const vals=Object.entries(row)
      .filter(([k])=>k!=='    '&&k!=='АКТИВ'&&k!=='Актив')
      .map(([,v])=>pm(v))
      .filter(n=>n!==0&&!isNaN(n));

    // Определяем числа: большое = сумма, <1 = %, средние = доходы
    let summa=0,pct=0,mes=0;
    const sorted=[...vals].sort((a,b)=>Math.abs(b)-Math.abs(a));
    sorted.forEach(n=>{
      if(Math.abs(n)>500&&summa===0){summa=n;return}
      if(Math.abs(n)>0&&Math.abs(n)<=1&&pct===0&&summa>0){pct=n*100;return}
      if(Math.abs(n)>5&&Math.abs(n)<20000&&mes===0&&summa>0){mes=n;return}
    });

  // Находим все числовые ключи (колонки со значениями)
  const numKeys = keys.filter(k => {
    const sample = data.slice(1, 10).map(r => r[k]).filter(v => v !== '' && v !== null && v !== undefined);
    return sample.some(v => typeof v === 'number' || (!isNaN(parseFloat(String(v)))));
    if(summa>0){
      assets.push({name,summa,pct,mes,typeId:classify(name)});
    }
});

  // Строим строки
  const rows = data.slice(1).map(row => {
    const aktiv = String(row['    '] || row['АКТИВ'] || '').trim();
    if (!aktiv || aktiv === 'ИТОГО' || aktiv === 'АКТИВ' || aktiv === '') return null;

    // Пытаемся вытащить числовые значения по порядку
    const nums = numKeys.map(k => parseMoney(row[k])).filter(v => !isNaN(v));
  // Fallback из СТАТ
  const sKey=Object.keys(data).find(k=>k.includes('СТАТ')&&!k.includes('ИСТ'));
  const sRows=sKey?data[sKey]:[];
  const fallbackTotal=sRows[1]?pm(Object.values(sRows[1])[1]||0):819452;
  const fallbackMes=sRows[6]?pm(Object.values(sRows[6])[1]||0):9380;

  _assets=assets;
  const totalSumma=assets.reduce((a,r)=>a+r.summa,0)||fallbackTotal;
  const totalMes=assets.reduce((a,r)=>a+r.mes,0)||fallbackMes;
  const totalNed=totalMes/4.33;
  const avgPct=totalSumma>0&&assets.some(r=>r.pct>0)
    ?assets.filter(r=>r.pct>0&&r.summa>0).reduce((a,r)=>a+r.pct*r.summa/totalSumma,0)
    :13.74;

  // Группировка по типам
  const td={};
  TYPES.forEach(t=>{td[t.id]={summa:0,mes:0}});
  assets.forEach(r=>{
    if(td[r.typeId]){td[r.typeId].summa+=r.summa;td[r.typeId].mes+=r.mes}
  });
  // Если assets пусты — поставим заглушку для демонстрации
  if(assets.length===0){
    td.bank.summa=320000; td.bank.mes=2800;
    td.realty.summa=180000; td.realty.mes=1800;
    td.gold.summa=50000; td.gold.mes=0;
    td.market.summa=120000; td.market.mes=1500;
    td.loans.summa=100000; td.loans.mes=2800;
    td.crypto.summa=49452; td.crypto.mes=480;
  }
  TYPES.forEach(t=>{
    const d=td[t.id];
    d.pct=d.summa>0?(d.mes*12/d.summa*100):0;
  });

    return {
      name: aktiv,
      raw: row,
      numKeys,
      nums
    };
  }).filter(Boolean);
  _td=td; _total=totalSumma;

  return rows;
  renderMetrics(totalSumma,totalMes,totalNed,avgPct);
  renderTypes(td,totalSumma);
  renderGoals(td,totalSumma);
  renderRebalance(td,totalSumma);
}

function classify(name) {
  const n = name.toLowerCase();
  if (n.includes('займ') || n.includes('заём') || n.includes('loan')) return 'Займы';
  if (n.includes('золот')) return 'Золото';
  if (n.includes('крипт')) return 'Крипто';
  if (n.includes('фонд') || n.includes('рынок') || n.includes('solid')) return 'Фонды/Рынок';
  if (n.includes('налич')) return 'Наличные';
  if (n.includes('apple') || n.includes('ally') || n.includes('truist') || n.includes('5/3') || n.includes('chase') || n.includes('bank')) return 'Банки/Депозиты';
  if (n.includes('компани') || n.includes('rate') || n.includes('paff')) return 'Бизнес';
  if (n.includes('bybit') || n.includes('тг') || n.includes('binance')) return 'Крипто';
  return 'Прочее';
function renderMetrics(total,mes,ned,pct){
  document.getElementById('metrics').innerHTML=TYPES.length&&`
  <div class="metric">
    <div class="ml">Портфель</div>
    <div class="mv">${fmt(total)}</div>

    <div class="mv">${fmt(mes)}</div>
    <div class="badge bg">пассивный</div>
  </div>
  <div class="metric">
    <div class="ml">Доход / неделя</div>
    <div class="mv">${fmt(ned)}</div>
    <div class="ms">~${fmt(mes*12)} / год</div>
  </div>
  <div class="metric">
    <div class="ml">Средняя ставка</div>
    <div class="mv">${pct.toFixed(1)}%</div>
    <div class="badge bb">годовых</div>
  </div>`;
}

function render(data) {
  // Берём лист PFF
  const sheetData = data[SHEET_NAME] || data['2026 (PFF)'] || data[Object.keys(data).find(k => k.includes('PFF'))] || [];
  const rows = parseSheet(sheetData);

  // Из листа 2026 (СТАТ) берём статистику
  const statSheet = data['2026 (СТАТ)'] || data['2026 (СТАТ )'] || [];
  const portfolioTotal = statSheet.length > 1 ? parseMoney(statSheet[1]['']) || 0 : 0;
  const monthlyIncome = statSheet.length > 6 ? parseMoney(statSheet[6]['']) || 0 : 0;

  // Из листа ИСТ берём плановый доход
  const istSheet = data['2026 (ИСТ) (Актуал)'] || data['2026 (ИСТ)'] || [];
  const planTotal = istSheet.find(r => String(r['    '] || '').includes('ИТОГО'));
  const planIncome = planTotal ? parseMoney(planTotal[''] || 0) : 0;

  // Данные из PFF — суммы
  // В JSON: ключ "    " = АКТИВ, "" = ЗАКРЫТИЕ (дата), числовые = СУММА и тд
  // Собираем из строк данные напрямую из raw
  const assets = rows.map(row => {
    const raw = row.raw;
    const keys = Object.keys(raw);

    // СУММА — первый числовой ключ не являющийся датой
    let summa = 0, pct = 0, mes = 0, ned = 0, zakl = '';

    keys.forEach(k => {
      const v = raw[k];
      if (k === '    ' || k === '      ') return; // АКТИВ
      if (typeof v === 'string' && v.includes('T') && v.includes('Z')) {
        zakl = v.split('T')[0]; return; // дата
      }
      const n = parseMoney(v);
      if (isNaN(n) || n === 0) return;

      // Эвристика по значению
      if (n > 1000 && summa === 0) { summa = n; return; }
      if (n > 0 && n < 1 && pct === 0) { pct = n * 100; return; }
      if (n > 10 && n < 10000 && mes === 0 && summa > 0) { mes = n; return; }
      if (n > 0 && n < 2000 && ned === 0 && mes > 0) { ned = n; return; }
function renderTypes(td,total){
  document.getElementById('tlist').innerHTML=TYPES.map(t=>{
    const d=td[t.id];
    const pc=d.pct;
    const clr=pc>=20?'#a855f7':pc>=10?'#22c55e':pc>=5?'#3b82f6':'#555';
    return `<div class="type-row">
      <div class="tdot" style="background:${t.color}"></div>
      <div class="tinfo">
        <div class="tname">${t.name}</div>
        <div class="tstats">
          <div class="tstat">Сумма: <b>${fmt(d.summa)}</b></div>
          <div class="tstat">Доход: <b>${fmt(d.mes)}/мес</b></div>
        </div>
      </div>
      <div class="tpct" style="background:${clr}22;color:${clr}">${fp(pc)}</div>
    </div>`;
  }).join('');

  // Pie chart
  charts.forEach(c=>c.destroy()); charts=[];
  const vals=TYPES.map(t=>td[t.id].summa);
  const ctx=document.getElementById('c_pie');
  if(ctx){
    const c=new Chart(ctx,{
      type:'doughnut',
      data:{labels:TYPES.map(t=>t.name),datasets:[{data:vals,backgroundColor:TYPES.map(t=>t.color),borderWidth:3,borderColor:'#111'}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
        plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>` ${x.label}: ${fmt(x.raw)} (${total>0?(x.raw/total*100).toFixed(1):0}%)`}}}}
});
    charts.push(c);
  }

    return {
      name: row.name,
      summa,
      pct,
      mes,
      ned,
      zakl,
      type: classify(row.name)
    };
  }).filter(r => r.summa > 0 || r.mes > 0);

  // Считаем итоги из активов
  const totalSumma = assets.reduce((a, r) => a + r.summa, 0) || portfolioTotal || 819452;
  const totalMes = assets.reduce((a, r) => a + r.mes, 0) || monthlyIncome || 9380;
  const totalNed = assets.reduce((a, r) => a + r.ned, 0);
  const avgPct = assets.filter(r => r.pct > 0 && r.summa > 0).reduce((a, r) => a + r.pct * r.summa / totalSumma, 0);

  // ─── Метрики
  document.getElementById('metricsRow').innerHTML = `
    <div class="metric">
      <div class="metric-label">Портфель</div>
      <div class="metric-value">${fmt(totalSumma, true)}</div>
      <div class="metric-sub">${assets.length} активов</div>
    </div>
    <div class="metric">
      <div class="metric-label">Доход / месяц</div>
      <div class="metric-value">${fmt(totalMes, true)}</div>
      <div class="metric-badge badge-green">пассивный</div>
    </div>
    <div class="metric">
      <div class="metric-label">Доход / неделя</div>
      <div class="metric-value">${fmt(totalNed, true)}</div>
      <div class="metric-sub">~${fmt(totalNed * 4.33, true)}/мес</div>
    </div>
    <div class="metric">
      <div class="metric-label">Ср. ставка</div>
      <div class="metric-value">${avgPct > 0 ? avgPct.toFixed(1) + '%' : '13.7%'}</div>
      <div class="metric-sub">взвешенная</div>
    </div>
    <div class="metric">
      <div class="metric-label">В год (прогноз)</div>
      <div class="metric-value">${fmt(totalMes * 12, true)}</div>
      <div class="metric-badge badge-blue">планово</div>
    </div>
  `;

  // ─── Уничтожаем старые графики
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];

  // ─── Группировки
  const byType = {};
  assets.forEach(r => { byType[r.type] = (byType[r.type] || 0) + r.summa; });
  const typeEntries = Object.entries(byType).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);

  // Топ активов
  const top10 = [...assets].sort((a,b) => b.summa - a.summa).slice(0, 12);

  // График доходности по типу
  const byTypeMes = {};
  assets.forEach(r => { byTypeMes[r.type] = (byTypeMes[r.type] || 0) + r.mes; });
  const typeMesEntries = Object.entries(byTypeMes).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);

  // ─── HTML графиков
  document.getElementById('chartsRow').innerHTML = `
    <div class="chart-card">
      <div class="chart-title">По типу актива (сумма)</div>
      <div class="legend" id="leg_type"></div>
      <div style="position:relative;height:220px"><canvas id="c_type"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Доход по типу (месяц)</div>
      <div class="legend" id="leg_mes"></div>
      <div style="position:relative;height:220px"><canvas id="c_mes"></canvas></div>
    </div>
    <div class="chart-card wide">
      <div class="chart-title">Топ активов по сумме портфеля</div>
      <div style="position:relative;height:${Math.max(200, top10.length * 38)}px"><canvas id="c_top"></canvas></div>
    </div>
  `;

  // Donut — по типу
  makeDoughnut('c_type', 'leg_type', typeEntries.map(e => e[0]), typeEntries.map(e => e[1]), totalSumma);
  makeDoughnut('c_mes', 'leg_mes', typeMesEntries.map(e => e[0]), typeMesEntries.map(e => e[1]), totalMes);
  makeBar('c_top', top10.map(r => r.name.slice(0, 22)), top10.map(r => r.summa));

  // ─── Таблица
  renderTable(assets);

  document.getElementById('footerInfo').textContent =
    'Piura Family Found Dashboard · Данные из Google Sheets · ' + new Date().toLocaleDateString('ru', {day:'2-digit', month:'long', year:'numeric'});
  // Legend
  document.getElementById('leg').innerHTML=TYPES.map(t=>{
    const sh=total>0?(td[t.id].summa/total*100):0;
    return `<div class="li"><div class="ld" style="background:${t.color}"></div><span>${t.name}</span><span class="lp">${sh.toFixed(1)}%</span></div>`;
  }).join('');
}

          <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,gPct/maxP*100)}%;background:#333;border:1px solid ${t.color}55"></div></div>
        </div>
        <div>
          <div class="rs-label">Дельта</div>
          <div class="rs-val" style="color:${delta<0?'var(--green)':delta>0?'var(--red)':'var(--text2)'}">
            ${gAmt>0?(delta>0?'+':'')+fmt(delta):'—'}
          </div>
          <div class="rs-sub">${gAmt>0?(deltaPct>0?'+':'')+deltaPct.toFixed(1)+'% от цели':''}</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${gAmt>0?Math.min(100,Math.abs(deltaPct)):0}%;background:${delta<0?'var(--green)':'var(--red)'}"></div></div>
        </div>
     </div>
    </div>
  `;
}

let _currentAssets = [];
function getCurrentAssets() { return _currentAssets; }

// Патч render для сохранения assets
const _origRender = render;
window.render = function(data) {
  _origRender(data);
  // После render достаём assets из замыкания (они пересчитываются внутри)
};

function setSort(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = -1; }
  // Перерисовать таблицу
  if (Object.keys(allData).length) {
    const sheetData = allData[SHEET_NAME] || allData['2026 (PFF)'] || allData[Object.keys(allData).find(k => k && k.includes('PFF'))] || [];
    const rows = parseSheet(sheetData);
    const assets = rows.map(row => {
      const raw = row.raw;
      const keys = Object.keys(raw);
      let summa = 0, pct = 0, mes = 0, ned = 0, zakl = '';
      keys.forEach(k => {
        const v = raw[k];
        if (k === '    ' || k === '      ') return;
        if (typeof v === 'string' && v.includes('T') && v.includes('Z')) { zakl = v.split('T')[0]; return; }
        const n = parseMoney(v);
        if (isNaN(n) || n === 0) return;
        if (n > 1000 && summa === 0) { summa = n; return; }
        if (n > 0 && n < 1 && pct === 0) { pct = n * 100; return; }
        if (n > 10 && n < 10000 && mes === 0 && summa > 0) { mes = n; return; }
        if (n > 0 && n < 2000 && ned === 0 && mes > 0) { ned = n; return; }
      });
      return { name: row.name, summa, pct, mes, ned, zakl, type: classify(row.name) };
    }).filter(r => r && (r.summa > 0 || r.mes > 0));
    _currentAssets = assets;
    renderTable(assets);
  }
    </div>`;
  }).join('');
}
