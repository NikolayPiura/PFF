<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piura Family Found</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--bg2:#111;--bg3:#181818;--bg4:#222;
  --border:#252525;--text:#fff;--text2:#aaa;--text3:#555;
  --blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:32px 40px 28px;display:flex;align-items:flex-end;justify-content:space-between}
.logo{font-size:56px;font-weight:900;letter-spacing:-2px;line-height:1}
.logo .fam{color:var(--blue)}
.header-meta{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.upd{font-size:13px;color:var(--text3)}
.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:12px 26px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s}
.btn:hover{background:#2563eb}
.btn.loading{opacity:.5;pointer-events:none}

/* CONTAINER */
.wrap{padding:32px 40px;display:flex;flex-direction:column;gap:32px;max-width:1440px;margin:0 auto}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:28px 30px}
.ml{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.mv{font-size:44px;font-weight:900;line-height:1;letter-spacing:-1px}
.ms{font-size:14px;color:var(--text2);margin-top:8px}
.badge{display:inline-block;margin-top:10px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.05em}
.bg{background:rgba(34,197,94,.15);color:var(--green)}
.bb{background:rgba(59,130,246,.15);color:var(--blue)}

/* SECTION */
.sec-title{font-size:24px;font-weight:800;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.sec-title::before{content:'';width:4px;height:26px;background:var(--blue);border-radius:2px;display:block}

/* TYPES */
.types-grid{display:grid;grid-template-columns:1fr 380px;gap:20px}
.types-list{display:flex;flex-direction:column;gap:12px}
.type-row{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px 22px;display:flex;align-items:center;gap:16px}
.tdot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.tinfo{flex:1}
.tname{font-size:16px;font-weight:700}
.tstats{display:flex;gap:20px;margin-top:6px}
.tstat{font-size:13px;color:var(--text2)}
.tstat b{color:var(--text);font-weight:700}
.tpct{font-size:14px;font-weight:800;padding:5px 12px;border-radius:8px}

.chart-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:16px}
.legend{display:flex;flex-direction:column;gap:8px;width:100%}
.li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2)}
.ld{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.lp{margin-left:auto;color:var(--text);font-weight:700}

/* GOALS */
.goals-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.goals-list{display:flex;flex-direction:column;gap:10px}
.goal-row{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:14px}
.gdot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.gname{flex:1;font-size:15px;font-weight:600}
.gcur{font-size:13px;color:var(--text3);min-width:90px;text-align:right}
.ginp-wrap{display:flex;align-items:center;gap:6px}
.gsign{color:var(--text3);font-size:14px;font-weight:700}
.ginp{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-weight:700;padding:8px 12px;width:120px;outline:none}
.ginp:focus{border-color:var(--blue)}

/* REBALANCE */
.reb-list{display:flex;flex-direction:column;gap:14px}
.reb-row{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:22px 24px}
.reb-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.rdot{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.rname{font-size:16px;font-weight:700;flex:1}
.rind{font-size:12px;font-weight:800;padding:5px 14px;border-radius:20px}
.ibuy{background:rgba(34,197,94,.15);color:var(--green)}
.isell{background:rgba(239,68,68,.15);color:var(--red)}
.iok{background:rgba(59,130,246,.15);color:var(--blue)}
.reb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.rs-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.rs-val{font-size:24px;font-weight:800}
.rs-sub{font-size:12px;color:var(--text3);margin-top:3px}
.bar-bg{height:7px;background:var(--bg4);border-radius:4px;margin-top:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .7s ease}

/* LOADING */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:18px}
.spin{width:48px;height:48px;border:3px solid #222;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ltxt{font-size:16px;color:var(--text2)}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:18px;color:var(--red);font-size:14px}
</style>
</head>
<body>

<div class="overlay" id="ov">
  <div class="spin"></div>
  <div class="ltxt">Загружаем данные из Google Sheets…</div>
</div>

<div class="header">
  <div class="logo">Piura <span class="fam">Family</span> Found</div>
  <div class="header-meta">
    <span class="upd" id="upd">—</span>
    <button class="btn" id="rbtn" onclick="loadData()">↻ Обновить</button>
  </div>
</div>

<div class="wrap">
  <div id="err" style="display:none" class="err"></div>

  <!-- МЕТРИКИ -->
  <div class="metrics" id="metrics"></div>

  <!-- АКТИВЫ ПО ТИПАМ -->
  <div>
    <div class="sec-title">Активы по типам</div>
    <div class="types-grid">
      <div class="types-list" id="tlist"></div>
      <div class="chart-box">
        <div style="position:relative;width:280px;height:280px"><canvas id="c_pie"></canvas></div>
        <div class="legend" id="leg"></div>
      </div>
    </div>
  </div>

  <!-- ЦЕЛИ -->
  <div>
    <div class="sec-title">Цели по типам</div>
    <div class="goals-grid">
      <div class="goals-list" id="glist"></div>
      <div class="chart-box" style="justify-content:center">
        <div style="position:relative;width:100%;height:320px"><canvas id="c_goals"></canvas></div>
      </div>
    </div>
  </div>

  <!-- РЕБАЛАНСИРОВКА -->
  <div>
    <div class="sec-title">Ребалансировка</div>
    <div class="reb-list" id="rlist"></div>
  </div>

  <div style="text-align:center;padding:20px 0;font-size:12px;color:var(--text3)">
    Piura Family Found · Данные из Google Sheets · Автообновление каждые 5 мин
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyGRwLrCvO4MxYZOssBDIwMONBTZA1yOrJ1OekFTX3rVnjqbvLb0XI8d1ngDybRHrZs/exec';

const TYPES = [
  {id:'bank',   name:'Счета, вклады и нал',  color:'#3b82f6', kw:['ally','truist','5/3','chase','bank','налич','счёт','вклад','нал','депозит']},
  {id:'realty', name:'Инвест. недвижимость', color:'#f59e0b', kw:['недвиж','realty','квартир','дом','аренд']},
  {id:'gold',   name:'Золото',               color:'#eab308', kw:['золот','gold','слиток']},
  {id:'market', name:'Фондовый рынок',       color:'#22c55e', kw:['фондов','рынок','apple','акци','solid','фонд','market','etf','бирж']},
  {id:'loans',  name:'Займы / бизнес',       color:'#a855f7', kw:['займ','заём','loan','компани','rate','paff','ганзюк','лукьян','даламан','чеботок','ольхов','пашков','процент']},
  {id:'crypto', name:'Крипта / проекты',     color:'#06b6d4', kw:['крипт','bybit','тг','binance','битко','юсдт','usdt','btc','eth','tok']},
];

let charts = [];
let _td = null, _total = 0, _assets = [];

function pm(v){
  if(v===null||v===undefined||v===''||v==='-') return 0;
  const n=parseFloat(String(v).replace(/[$\s,\u00a0\u202f]/g,'').replace(',','.'));
  return isNaN(n)?0:n;
}
function fmt(n){
  if(!n&&n!==0) return '$0';
  n=Math.round(n);
  if(Math.abs(n)>=1000000) return '$'+(n/1000000).toFixed(2)+'M';
  if(Math.abs(n)>=1000) return '$'+n.toLocaleString('ru');
  return '$'+n;
}
function fp(n){return n?n.toFixed(1)+'%':'0%'}

function classify(name){
  const n=name.toLowerCase();
  for(const t of TYPES){
    if(t.kw.some(k=>n.includes(k))) return t.id;
  }
  return 'loans';
}

function loadGoals(){try{return JSON.parse(localStorage.getItem('pff_g')||'{}')}catch(e){return {}}}
function saveGoal(id,v){const g=loadGoals();g[id]=v;localStorage.setItem('pff_g',JSON.stringify(g))}

async function loadData(){
  document.getElementById('rbtn').classList.add('loading');
  document.getElementById('ov').style.display='flex';
  document.getElementById('err').style.display='none';
  try{
    const r=await fetch(API+'?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    process(data);
    document.getElementById('upd').textContent='Обновлено: '+new Date().toLocaleString('ru');
  }catch(e){
    const eb=document.getElementById('err');
    eb.style.display='block';
    eb.textContent='Ошибка: '+e.message;
  }finally{
    document.getElementById('ov').style.display='none';
    document.getElementById('rbtn').classList.remove('loading');
  }
}

function process(data){
  // Найти лист PFF
  const pKey=Object.keys(data).find(k=>k.includes('PFF')&&!k.includes('2')&&!k.includes('3'));
  const rows=pKey?data[pKey]:[];

  const assets=[];
  rows.forEach(row=>{
    // Имя актива может быть в разных ключах
    const name=String(
      row['    ']||row['АКТИВ']||row['Актив']||row['актив']||
      Object.values(row)[0]||''
    ).trim();
    if(!name||name.toUpperCase()==='ИТОГО'||name.toUpperCase()==='АКТИВ'||name==='') return;

    const vals=Object.entries(row)
      .filter(([k])=>k!=='    '&&k!=='АКТИВ'&&k!=='Актив')
      .map(([,v])=>pm(v))
      .filter(n=>n!==0&&!isNaN(n));

    // Определяем числа: большое = сумма, <1 = %, средние = доходы
    let summa=0,pct=0,mes=0;
    const sorted=[...vals].sort((a,b)=>Math.abs(b)-Math.abs(a));
    sorted.forEach(n=>{
      if(Math.abs(n)>500&&summa===0){summa=n;return}
      if(Math.abs(n)>0&&Math.abs(n)<=1&&pct===0&&summa>0){pct=n*100;return}
      if(Math.abs(n)>5&&Math.abs(n)<20000&&mes===0&&summa>0){mes=n;return}
    });

    if(summa>0){
      assets.push({name,summa,pct,mes,typeId:classify(name)});
    }
  });

  // Fallback из СТАТ
  const sKey=Object.keys(data).find(k=>k.includes('СТАТ')&&!k.includes('ИСТ'));
  const sRows=sKey?data[sKey]:[];
  const fallbackTotal=sRows[1]?pm(Object.values(sRows[1])[1]||0):819452;
  const fallbackMes=sRows[6]?pm(Object.values(sRows[6])[1]||0):9380;

  _assets=assets;
  const totalSumma=assets.reduce((a,r)=>a+r.summa,0)||fallbackTotal;
  const totalMes=assets.reduce((a,r)=>a+r.mes,0)||fallbackMes;
  const totalNed=totalMes/4.33;
  const avgPct=totalSumma>0&&assets.some(r=>r.pct>0)
    ?assets.filter(r=>r.pct>0&&r.summa>0).reduce((a,r)=>a+r.pct*r.summa/totalSumma,0)
    :13.74;

  // Группировка по типам
  const td={};
  TYPES.forEach(t=>{td[t.id]={summa:0,mes:0}});
  assets.forEach(r=>{
    if(td[r.typeId]){td[r.typeId].summa+=r.summa;td[r.typeId].mes+=r.mes}
  });
  // Если assets пусты — поставим заглушку для демонстрации
  if(assets.length===0){
    td.bank.summa=320000; td.bank.mes=2800;
    td.realty.summa=180000; td.realty.mes=1800;
    td.gold.summa=50000; td.gold.mes=0;
    td.market.summa=120000; td.market.mes=1500;
    td.loans.summa=100000; td.loans.mes=2800;
    td.crypto.summa=49452; td.crypto.mes=480;
  }
  TYPES.forEach(t=>{
    const d=td[t.id];
    d.pct=d.summa>0?(d.mes*12/d.summa*100):0;
  });

  _td=td; _total=totalSumma;

  renderMetrics(totalSumma,totalMes,totalNed,avgPct);
  renderTypes(td,totalSumma);
  renderGoals(td,totalSumma);
  renderRebalance(td,totalSumma);
}

function renderMetrics(total,mes,ned,pct){
  document.getElementById('metrics').innerHTML=TYPES.length&&`
  <div class="metric">
    <div class="ml">Портфель</div>
    <div class="mv">${fmt(total)}</div>
    <div class="ms">${_assets.length} активов</div>
  </div>
  <div class="metric">
    <div class="ml">Доход / месяц</div>
    <div class="mv">${fmt(mes)}</div>
    <div class="badge bg">пассивный</div>
  </div>
  <div class="metric">
    <div class="ml">Доход / неделя</div>
    <div class="mv">${fmt(ned)}</div>
    <div class="ms">~${fmt(mes*12)} / год</div>
  </div>
  <div class="metric">
    <div class="ml">Средняя ставка</div>
    <div class="mv">${pct.toFixed(1)}%</div>
    <div class="badge bb">годовых</div>
  </div>`;
}

function renderTypes(td,total){
  document.getElementById('tlist').innerHTML=TYPES.map(t=>{
    const d=td[t.id];
    const pc=d.pct;
    const clr=pc>=20?'#a855f7':pc>=10?'#22c55e':pc>=5?'#3b82f6':'#555';
    return `<div class="type-row">
      <div class="tdot" style="background:${t.color}"></div>
      <div class="tinfo">
        <div class="tname">${t.name}</div>
        <div class="tstats">
          <div class="tstat">Сумма: <b>${fmt(d.summa)}</b></div>
          <div class="tstat">Доход: <b>${fmt(d.mes)}/мес</b></div>
        </div>
      </div>
      <div class="tpct" style="background:${clr}22;color:${clr}">${fp(pc)}</div>
    </div>`;
  }).join('');

  // Pie chart
  charts.forEach(c=>c.destroy()); charts=[];
  const vals=TYPES.map(t=>td[t.id].summa);
  const ctx=document.getElementById('c_pie');
  if(ctx){
    const c=new Chart(ctx,{
      type:'doughnut',
      data:{labels:TYPES.map(t=>t.name),datasets:[{data:vals,backgroundColor:TYPES.map(t=>t.color),borderWidth:3,borderColor:'#111'}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'62%',
        plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>` ${x.label}: ${fmt(x.raw)} (${total>0?(x.raw/total*100).toFixed(1):0}%)`}}}}
    });
    charts.push(c);
  }

  // Legend
  document.getElementById('leg').innerHTML=TYPES.map(t=>{
    const sh=total>0?(td[t.id].summa/total*100):0;
    return `<div class="li"><div class="ld" style="background:${t.color}"></div><span>${t.name}</span><span class="lp">${sh.toFixed(1)}%</span></div>`;
  }).join('');
}

function renderGoals(td,total){
  const goals=loadGoals();
  document.getElementById('glist').innerHTML=TYPES.map(t=>{
    const d=td[t.id];
    const gv=goals[t.id]||'';
    return `<div class="goal-row">
      <div class="gdot" style="background:${t.color}"></div>
      <div class="gname">${t.name}</div>
      <div class="gcur">${fmt(d.summa)}</div>
      <div class="ginp-wrap">
        <span class="gsign">$</span>
        <input class="ginp" type="number" placeholder="0" value="${gv}"
          onchange="saveGoal('${t.id}',parseFloat(this.value)||0);updateGoalsChart();updateReb()">
      </div>
    </div>`;
  }).join('');
  drawGoalsChart(td);
}

function drawGoalsChart(td){
  const goals=loadGoals();
  const old=charts.find(c=>c.canvas&&c.canvas.id==='c_goals');
  if(old){old.destroy();charts=charts.filter(c=>c!==old)}
  const ctx=document.getElementById('c_goals');
  if(!ctx) return;
  const c=new Chart(ctx,{
    type:'bar',
    data:{
      labels:TYPES.map(t=>t.name.length>15?t.name.slice(0,15)+'…':t.name),
      datasets:[
        {label:'Факт',data:TYPES.map(t=>(td||_td)[t.id].summa),backgroundColor:TYPES.map(t=>t.color+'cc'),borderRadius:6},
        {label:'Цель',data:TYPES.map(t=>parseFloat(goals[t.id])||0),backgroundColor:TYPES.map(t=>t.color+'33'),borderColor:TYPES.map(t=>t.color),borderWidth:2,borderRadius:6}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#888',font:{size:13}}},tooltip:{callbacks:{label:x=>` ${x.dataset.label}: ${fmt(x.raw)}`}}},
      scales:{
        x:{ticks:{color:'#555',font:{size:11}},grid:{color:'#1a1a1a'}},
        y:{ticks:{color:'#555',font:{size:11},callback:v=>fmt(v)},grid:{color:'#1a1a1a'}}
      }
    }
  });
  charts.push(c);
}

function renderRebalance(td,total){
  const goals=loadGoals();
  const gTotal=TYPES.reduce((a,t)=>a+(parseFloat(goals[t.id])||0),0);
  document.getElementById('rlist').innerHTML=TYPES.map(t=>{
    const d=td[t.id];
    const curPct=total>0?(d.summa/total*100):0;
    const gAmt=parseFloat(goals[t.id])||0;
    const gPct=gTotal>0?(gAmt/gTotal*100):0;
    const delta=gAmt>0?(d.summa-gAmt):0;
    const deltaPct=gAmt>0?((d.summa-gAmt)/gAmt*100):0;
    const maxP=Math.max(curPct,gPct,1);

    let indCls,indTxt;
    if(gAmt===0){indCls='iok';indTxt='Цель не задана'}
    else if(delta<-gAmt*0.05){indCls='ibuy';indTxt='↑ Докупить'}
    else if(delta>gAmt*0.05){indCls='isell';indTxt='↓ Сократить'}
    else{indCls='iok';indTxt='✓ В норме'}

    return `<div class="reb-row">
      <div class="reb-head">
        <div class="rdot" style="background:${t.color}"></div>
        <div class="rname">${t.name}</div>
        <div class="rind ${indCls}">${indTxt}</div>
      </div>
      <div class="reb-stats">
        <div>
          <div class="rs-label">Текущее</div>
          <div class="rs-val" style="color:${t.color}">${fmt(d.summa)}</div>
          <div class="rs-sub">${fp(curPct)} портфеля</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,curPct/maxP*100)}%;background:${t.color}"></div></div>
        </div>
        <div>
          <div class="rs-label">Цель</div>
          <div class="rs-val" style="color:var(--text2)">${gAmt>0?fmt(gAmt):'—'}</div>
          <div class="rs-sub">${gPct>0?fp(gPct)+' целевых':''}</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100,gPct/maxP*100)}%;background:#333;border:1px solid ${t.color}55"></div></div>
        </div>
        <div>
          <div class="rs-label">Дельта</div>
          <div class="rs-val" style="color:${delta<0?'var(--green)':delta>0?'var(--red)':'var(--text2)'}">
            ${gAmt>0?(delta>0?'+':'')+fmt(delta):'—'}
          </div>
          <div class="rs-sub">${gAmt>0?(deltaPct>0?'+':'')+deltaPct.toFixed(1)+'% от цели':''}</div>
          <div class="bar-bg"><div class="bar-fill" style="width:${gAmt>0?Math.min(100,Math.abs(deltaPct)):0}%;background:${delta<0?'var(--green)':'var(--red)'}"></div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.saveGoal=function(id,v){saveGoal(id,v)};
window.updateGoalsChart=function(){if(_td)drawGoalsChart(_td)};
