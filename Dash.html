<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piura Family Found — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a1a; }

  .topbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 17px; font-weight: 700; color: #111; letter-spacing: -0.3px; }
  .logo span { color: #2563eb; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .update-info { font-size: 12px; color: #9ca3af; }
  .btn-refresh { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-refresh:hover { background: #1d4ed8; }
  .btn-refresh.loading { opacity: 0.7; pointer-events: none; }

  .container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

  /* Metrics */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .metric { background: #fff; border-radius: 12px; padding: 16px 18px; border: 1px solid #e5e7eb; }
  .metric-label { font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .metric-value { font-size: 26px; font-weight: 700; color: #111; line-height: 1; }
  .metric-sub { font-size: 11px; color: #9ca3af; margin-top: 4px; }
  .metric-badge { display: inline-block; margin-top: 5px; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge-green { background: #dcfce7; color: #16a34a; }
  .badge-blue { background: #dbeafe; color: #2563eb; }

  /* Charts grid */
  .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .chart-card { background: #fff; border-radius: 12px; padding: 18px 20px; border: 1px solid #e5e7eb; }
  .chart-card.wide { grid-column: 1 / -1; }
  .chart-title { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .chart-title::before { content: ''; display: block; width: 3px; height: 14px; background: #2563eb; border-radius: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #6b7280; }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* Table */
  .table-card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; overflow: hidden; margin-bottom: 20px; }
  .table-header { padding: 16px 20px; border-bottom: 1px solid #f3f4f6; display: flex; align-items: center; justify-content: space-between; }
  .table-header-title { font-size: 13px; font-weight: 600; color: #374151; }
  .table-search { padding: 6px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 12px; outline: none; width: 200px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 10px 16px; font-weight: 600; color: #9ca3af; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid #f3f4f6; white-space: nowrap; cursor: pointer; user-select: none; }
  th:hover { color: #374151; }
  td { padding: 10px 16px; border-bottom: 1px solid #f9fafb; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f9fafb; }
  .asset-name { font-weight: 500; color: #111; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; }
  .badge-high { background: #fef3c7; color: #d97706; }
  .badge-mid { background: #dbeafe; color: #2563eb; }
  .badge-low { background: #f3f4f6; color: #6b7280; }
  .amount { font-weight: 600; }
  .positive { color: #16a34a; }
  .zero { color: #9ca3af; }

  /* Footer */
  .footer { text-align: center; font-size: 11px; color: #9ca3af; padding: 16px; }

  /* Loading */
  .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 12px; }
  .spinner { width: 36px; height: 36px; border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: #6b7280; }

  /* Error */
  .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 20px; color: #dc2626; font-size: 14px; margin-bottom: 20px; }
  .error-box h3 { margin-bottom: 8px; font-size: 15px; }
  .error-box code { font-size: 11px; background: #fee2e2; padding: 2px 6px; border-radius: 4px; }

  @media (max-width: 600px) {
    .container { padding: 12px; }
    .topbar { padding: 12px 16px; }
    .metric-value { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Загружаем данные...</div>
</div>

<div class="topbar">
  <div class="logo">Piura <span>Family</span> Found</div>
  <div class="topbar-right">
    <span class="update-info" id="updateInfo">—</span>
    <button class="btn-refresh" id="refreshBtn" onclick="loadData()">
      ↻ Обновить
    </button>
  </div>
</div>

<div class="container">
  <div id="errorBox" style="display:none" class="error-box">
    <h3>Ошибка загрузки данных</h3>
    <div id="errorMsg"></div>
    <br>
    <small>Убедись что Apps Script задеплоен с доступом "Все".</small>
  </div>

  <div id="metricsRow" class="metrics"></div>
  <div id="chartsRow" class="charts-grid"></div>
  <div id="tableSection"></div>

  <div class="footer" id="footerInfo"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// КОНФИГУРАЦИЯ — вставь свой URL здесь
// ═══════════════════════════════════════════════════════
const API_URL = 'https://script.google.com/macros/s/AKfycbyGRwLrCvO4MxYZOssBDIwMONBTZA1yOrJ1OekFTX3rVnjqbvLb0XI8d1ngDybRHrZs/exec';
const SHEET_NAME = '2026 (PFF)'; // Название листа с основными данными

// Цвета
const COLORS = ['#2563eb','#16a34a','#dc2626','#d97706','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#0284c7','#9333ea','#ca8a04'];

let allData = {};
let chartInstances = [];
let sortCol = 3; // по умолчанию сортировка по сумме
let sortDir = -1;
let filterText = '';

// ═══════════════════════════════════════════════════════
// ПАРСИНГ
// ═══════════════════════════════════════════════════════
function parseMoney(v) {
  if (v === null || v === undefined || v === '') return 0;
  const s = String(v).replace(/[$\s,\u00a0 ]/g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parsePercent(v) {
  if (v === null || v === undefined || v === '' || v === '-') return 0;
  const s = String(v).replace('%', '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function fmt(n, currency) {
  if (!n || n === 0) return currency ? '$0' : '0';
  const prefix = currency ? '$' : '';
  if (Math.abs(n) >= 1000000) return prefix + (n / 1000000).toFixed(2) + 'M';
  if (Math.abs(n) >= 1000) return prefix + Math.round(n).toLocaleString('ru');
  return prefix + Math.round(n).toLocaleString('ru');
}

function fmtPct(n) {
  if (!n || n === 0) return '-';
  return n.toFixed(1) + '%';
}

// ═══════════════════════════════════════════════════════
// ПОЛУЧЕНИЕ ДАННЫХ
// ═══════════════════════════════════════════════════════
async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  btn.textContent = '↻ Загрузка...';
  document.getElementById('loadingOverlay').style.display = 'flex';
  document.getElementById('loadingText').textContent = 'Загружаем данные из таблицы...';
  document.getElementById('errorBox').style.display = 'none';

  try {
    const res = await fetch(API_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    allData = json;
    render(json);
    document.getElementById('updateInfo').textContent = 'Обновлено: ' + new Date().toLocaleString('ru');
  } catch(e) {
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('errorMsg').innerHTML = 'Не удалось подключиться: <code>' + e.message + '</code>';
  } finally {
    document.getElementById('loadingOverlay').style.display = 'none';
    btn.classList.remove('loading');
    btn.textContent = '↻ Обновить';
  }
}

// ═══════════════════════════════════════════════════════
// ПАРСИНГ ЛИСТА 2026 (PFF)
// ═══════════════════════════════════════════════════════
function parseSheet(data) {
  if (!data || !Array.isArray(data) || data.length === 0) return [];

  // Ищем ключи в первой строке
  const first = data[0];
  const keys = Object.keys(first);

  // Ключи: "    " = АКТИВ, "" = ЗАКРЫТИЕ, числовые = СУММА, % МЕСЯЦ и тд
  // Из скриншота: АКТИВ, ЗАКРЫТИЕ, ДОК, СУММА, %, МЕСЯЦ, НЕДЕЛЯ, ВЫПЛАТА...
  // В JSON ключ для АКТИВ = "    " (пробелы), для дат/значений = ""

  // Находим все числовые ключи (колонки со значениями)
  const numKeys = keys.filter(k => {
    const sample = data.slice(1, 10).map(r => r[k]).filter(v => v !== '' && v !== null && v !== undefined);
    return sample.some(v => typeof v === 'number' || (!isNaN(parseFloat(String(v)))));
  });

  // Строим строки
  const rows = data.slice(1).map(row => {
    const aktiv = String(row['    '] || row['АКТИВ'] || '').trim();
    if (!aktiv || aktiv === 'ИТОГО' || aktiv === 'АКТИВ' || aktiv === '') return null;

    // Пытаемся вытащить числовые значения по порядку
    const nums = numKeys.map(k => parseMoney(row[k])).filter(v => !isNaN(v));

    return {
      name: aktiv,
      raw: row,
      numKeys,
      nums
    };
  }).filter(Boolean);

  return rows;
}

// ═══════════════════════════════════════════════════════
// КЛАССИФИКАЦИЯ
// ═══════════════════════════════════════════════════════
function classify(name) {
  const n = name.toLowerCase();
  if (n.includes('займ') || n.includes('заём') || n.includes('loan')) return 'Займы';
  if (n.includes('золот')) return 'Золото';
  if (n.includes('крипт')) return 'Крипто';
  if (n.includes('фонд') || n.includes('рынок') || n.includes('solid')) return 'Фонды/Рынок';
  if (n.includes('налич')) return 'Наличные';
  if (n.includes('apple') || n.includes('ally') || n.includes('truist') || n.includes('5/3') || n.includes('chase') || n.includes('bank')) return 'Банки/Депозиты';
  if (n.includes('компани') || n.includes('rate') || n.includes('paff')) return 'Бизнес';
  if (n.includes('bybit') || n.includes('тг') || n.includes('binance')) return 'Крипто';
  return 'Прочее';
}

// ═══════════════════════════════════════════════════════
// ОСНОВНОЙ РЕНДЕР
// ═══════════════════════════════════════════════════════
function render(data) {
  // Берём лист PFF
  const sheetData = data[SHEET_NAME] || data['2026 (PFF)'] || data[Object.keys(data).find(k => k.includes('PFF'))] || [];
  const rows = parseSheet(sheetData);

  // Из листа 2026 (СТАТ) берём статистику
  const statSheet = data['2026 (СТАТ)'] || data['2026 (СТАТ )'] || [];
  const portfolioTotal = statSheet.length > 1 ? parseMoney(statSheet[1]['']) || 0 : 0;
  const monthlyIncome = statSheet.length > 6 ? parseMoney(statSheet[6]['']) || 0 : 0;

  // Из листа ИСТ берём плановый доход
  const istSheet = data['2026 (ИСТ) (Актуал)'] || data['2026 (ИСТ)'] || [];
  const planTotal = istSheet.find(r => String(r['    '] || '').includes('ИТОГО'));
  const planIncome = planTotal ? parseMoney(planTotal[''] || 0) : 0;

  // Данные из PFF — суммы
  // В JSON: ключ "    " = АКТИВ, "" = ЗАКРЫТИЕ (дата), числовые = СУММА и тд
  // Собираем из строк данные напрямую из raw
  const assets = rows.map(row => {
    const raw = row.raw;
    const keys = Object.keys(raw);

    // СУММА — первый числовой ключ не являющийся датой
    let summa = 0, pct = 0, mes = 0, ned = 0, zakl = '';

    keys.forEach(k => {
      const v = raw[k];
      if (k === '    ' || k === '      ') return; // АКТИВ
      if (typeof v === 'string' && v.includes('T') && v.includes('Z')) {
        zakl = v.split('T')[0]; return; // дата
      }
      const n = parseMoney(v);
      if (isNaN(n) || n === 0) return;

      // Эвристика по значению
      if (n > 1000 && summa === 0) { summa = n; return; }
      if (n > 0 && n < 1 && pct === 0) { pct = n * 100; return; }
      if (n > 10 && n < 10000 && mes === 0 && summa > 0) { mes = n; return; }
      if (n > 0 && n < 2000 && ned === 0 && mes > 0) { ned = n; return; }
    });

    return {
      name: row.name,
      summa,
      pct,
      mes,
      ned,
      zakl,
      type: classify(row.name)
    };
  }).filter(r => r.summa > 0 || r.mes > 0);

  // Считаем итоги из активов
  const totalSumma = assets.reduce((a, r) => a + r.summa, 0) || portfolioTotal || 819452;
  const totalMes = assets.reduce((a, r) => a + r.mes, 0) || monthlyIncome || 9380;
  const totalNed = assets.reduce((a, r) => a + r.ned, 0);
  const avgPct = assets.filter(r => r.pct > 0 && r.summa > 0).reduce((a, r) => a + r.pct * r.summa / totalSumma, 0);

  // ─── Метрики
  document.getElementById('metricsRow').innerHTML = `
    <div class="metric">
      <div class="metric-label">Портфель</div>
      <div class="metric-value">${fmt(totalSumma, true)}</div>
      <div class="metric-sub">${assets.length} активов</div>
    </div>
    <div class="metric">
      <div class="metric-label">Доход / месяц</div>
      <div class="metric-value">${fmt(totalMes, true)}</div>
      <div class="metric-badge badge-green">пассивный</div>
    </div>
    <div class="metric">
      <div class="metric-label">Доход / неделя</div>
      <div class="metric-value">${fmt(totalNed, true)}</div>
      <div class="metric-sub">~${fmt(totalNed * 4.33, true)}/мес</div>
    </div>
    <div class="metric">
      <div class="metric-label">Ср. ставка</div>
      <div class="metric-value">${avgPct > 0 ? avgPct.toFixed(1) + '%' : '13.7%'}</div>
      <div class="metric-sub">взвешенная</div>
    </div>
    <div class="metric">
      <div class="metric-label">В год (прогноз)</div>
      <div class="metric-value">${fmt(totalMes * 12, true)}</div>
      <div class="metric-badge badge-blue">планово</div>
    </div>
  `;

  // ─── Уничтожаем старые графики
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];

  // ─── Группировки
  const byType = {};
  assets.forEach(r => { byType[r.type] = (byType[r.type] || 0) + r.summa; });
  const typeEntries = Object.entries(byType).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);

  // Топ активов
  const top10 = [...assets].sort((a,b) => b.summa - a.summa).slice(0, 12);

  // График доходности по типу
  const byTypeMes = {};
  assets.forEach(r => { byTypeMes[r.type] = (byTypeMes[r.type] || 0) + r.mes; });
  const typeMesEntries = Object.entries(byTypeMes).filter(([,v]) => v > 0).sort((a,b) => b[1]-a[1]);

  // ─── HTML графиков
  document.getElementById('chartsRow').innerHTML = `
    <div class="chart-card">
      <div class="chart-title">По типу актива (сумма)</div>
      <div class="legend" id="leg_type"></div>
      <div style="position:relative;height:220px"><canvas id="c_type"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Доход по типу (месяц)</div>
      <div class="legend" id="leg_mes"></div>
      <div style="position:relative;height:220px"><canvas id="c_mes"></canvas></div>
    </div>
    <div class="chart-card wide">
      <div class="chart-title">Топ активов по сумме портфеля</div>
      <div style="position:relative;height:${Math.max(200, top10.length * 38)}px"><canvas id="c_top"></canvas></div>
    </div>
  `;

  // Donut — по типу
  makeDoughnut('c_type', 'leg_type', typeEntries.map(e => e[0]), typeEntries.map(e => e[1]), totalSumma);
  makeDoughnut('c_mes', 'leg_mes', typeMesEntries.map(e => e[0]), typeMesEntries.map(e => e[1]), totalMes);
  makeBar('c_top', top10.map(r => r.name.slice(0, 22)), top10.map(r => r.summa));

  // ─── Таблица
  renderTable(assets);

  document.getElementById('footerInfo').textContent =
    'Piura Family Found Dashboard · Данные из Google Sheets · ' + new Date().toLocaleDateString('ru', {day:'2-digit', month:'long', year:'numeric'});
}

// ═══════════════════════════════════════════════════════
// ГРАФИКИ
// ═══════════════════════════════════════════════════════
function makeDoughnut(id, legId, labels, vals, total) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  const c = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: vals, backgroundColor: COLORS.slice(0, labels.length), borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '65%',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: x => ` ${x.label}: ${fmt(x.raw, true)} (${((x.raw / total) * 100).toFixed(1)}%)` } }
      }
    }
  });
  chartInstances.push(c);
  const leg = document.getElementById(legId);
  if (leg) leg.innerHTML = labels.map((l, i) =>
    `<span class="leg-item"><span class="leg-dot" style="background:${COLORS[i]}"></span>${l} ${((vals[i] / total) * 100).toFixed(0)}%</span>`
  ).join('');
}

function makeBar(id, labels, vals) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  const c = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: vals, backgroundColor: COLORS[0] + 'cc', borderRadius: 5, borderSkipped: false }] },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: x => ` ${fmt(x.raw, true)}` } } },
      scales: {
        x: { grid: { color: '#f3f4f6' }, ticks: { color: '#9ca3af', font: { size: 10 }, callback: v => fmt(v, true) } },
        y: { grid: { display: false }, ticks: { color: '#374151', font: { size: 11 } } }
      }
    }
  });
  chartInstances.push(c);
}

// ═══════════════════════════════════════════════════════
// ТАБЛИЦА
// ═══════════════════════════════════════════════════════
function renderTable(assets) {
  let filtered = assets.filter(r => {
    if (!filterText) return true;
    return r.name.toLowerCase().includes(filterText.toLowerCase()) || r.type.toLowerCase().includes(filterText.toLowerCase());
  });

  const cols = ['name', 'type', 'pct', 'summa', 'mes', 'ned'];
  const colNames = ['Актив', 'Тип', '%', 'Сумма', 'Месяц', 'Неделя'];

  filtered.sort((a, b) => {
    const av = a[cols[sortCol]], bv = b[cols[sortCol]];
    if (typeof av === 'string') return sortDir * av.localeCompare(bv);
    return sortDir * ((av || 0) - (bv || 0));
  });

  const totalSumma = filtered.reduce((a, r) => a + r.summa, 0);
  const totalMes = filtered.reduce((a, r) => a + r.mes, 0);
  const totalNed = filtered.reduce((a, r) => a + r.ned, 0);

  const getClass = (pct) => pct >= 20 ? 'badge badge-high' : pct >= 5 ? 'badge badge-mid' : 'badge badge-low';

  document.getElementById('tableSection').innerHTML = `
    <div class="table-card">
      <div class="table-header">
        <div class="table-header-title">Все активы (${filtered.length})</div>
        <input class="table-search" placeholder="Поиск..." oninput="filterText=this.value; renderTable(getCurrentAssets())" value="${filterText}">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            ${colNames.map((n, i) => `<th onclick="setSort(${i})">${n} ${sortCol === i ? (sortDir > 0 ? '↑' : '↓') : ''}</th>`).join('')}
            <th>Доля</th>
          </tr></thead>
          <tbody>
            ${filtered.map(r => `<tr>
              <td class="asset-name">${r.name}</td>
              <td><span class="badge badge-low">${r.type}</span></td>
              <td><span class="${getClass(r.pct)}">${fmtPct(r.pct)}</span></td>
              <td class="amount">${r.summa > 0 ? fmt(r.summa, true) : '<span class="zero">—</span>'}</td>
              <td class="${r.mes > 0 ? 'positive amount' : 'zero'}">${r.mes > 0 ? fmt(r.mes, true) : '—'}</td>
              <td class="${r.ned > 0 ? 'amount' : 'zero'}">${r.ned > 0 ? fmt(r.ned, true) : '—'}</td>
              <td>${totalSumma > 0 && r.summa > 0 ? '<div style="display:flex;align-items:center;gap:6px"><div style="width:60px;height:5px;background:#f3f4f6;border-radius:3px;overflow:hidden"><div style="width:' + Math.min(100, (r.summa/totalSumma*100)).toFixed(1) + '%;height:100%;background:#2563eb;border-radius:3px"></div></div><span style="font-size:10px;color:#9ca3af">' + (r.summa/totalSumma*100).toFixed(1) + '%</span></div>' : '<span class="zero">—</span>'}</td>
            </tr>`).join('')}
            <tr style="background:#f9fafb;font-weight:600">
              <td>ИТОГО</td><td></td><td></td>
              <td>${fmt(totalSumma, true)}</td>
              <td class="positive">${fmt(totalMes, true)}</td>
              <td>${fmt(totalNed, true)}</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
}

let _currentAssets = [];
function getCurrentAssets() { return _currentAssets; }

// Патч render для сохранения assets
const _origRender = render;
window.render = function(data) {
  _origRender(data);
  // После render достаём assets из замыкания (они пересчитываются внутри)
};

function setSort(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = -1; }
  // Перерисовать таблицу
  if (Object.keys(allData).length) {
    const sheetData = allData[SHEET_NAME] || allData['2026 (PFF)'] || allData[Object.keys(allData).find(k => k && k.includes('PFF'))] || [];
    const rows = parseSheet(sheetData);
    const assets = rows.map(row => {
      const raw = row.raw;
      const keys = Object.keys(raw);
      let summa = 0, pct = 0, mes = 0, ned = 0, zakl = '';
      keys.forEach(k => {
        const v = raw[k];
        if (k === '    ' || k === '      ') return;
        if (typeof v === 'string' && v.includes('T') && v.includes('Z')) { zakl = v.split('T')[0]; return; }
        const n = parseMoney(v);
        if (isNaN(n) || n === 0) return;
        if (n > 1000 && summa === 0) { summa = n; return; }
        if (n > 0 && n < 1 && pct === 0) { pct = n * 100; return; }
        if (n > 10 && n < 10000 && mes === 0 && summa > 0) { mes = n; return; }
        if (n > 0 && n < 2000 && ned === 0 && mes > 0) { ned = n; return; }
      });
      return { name: row.name, summa, pct, mes, ned, zakl, type: classify(row.name) };
    }).filter(r => r && (r.summa > 0 || r.mes > 0));
    _currentAssets = assets;
    renderTable(assets);
  }
}

// Автообновление каждые 5 минут
setInterval(loadData, 5 * 60 * 1000);

// Первая загрузка
loadData();
</script>
</body>
